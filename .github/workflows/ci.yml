# PR과 develop·main push마다 빌드·테스트를 돌린다.
# 실패하면 PR 화면에 빨간 X가 뜨고, main 보호 규칙을 켜 두면 머지 버튼이 막힌다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 빌드·테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 (local 프로필, H2)
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: 실패한 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test/

  receipt-rules:
    name: 영수증 규칙 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node ai/receipt/test_receipt.js

  secrets-guard:
    name: 비밀 파일 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: application-secret.yml, .env 가 올라왔는지 확인
        run: |
          found=$(git ls-files | grep -E '(^|/)(application-secret\.yml|\.env)$' || true)
          if [ -n "$found" ]; then
            echo "::error::올리면 안 되는 비밀 파일이 있다: $found"
            echo "git rm --cached 로 빼고, 들어 있던 키는 폐기·재발급한다."
            exit 1
          fi
          echo "비밀 파일 없음"
