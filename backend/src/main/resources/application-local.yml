# local: DB 설치 없이 H2 메모리 DB (MySQL 호환 모드). 서버를 끄면 데이터가 사라진다.
# H2 콘솔: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:yorijori, user: sa)
spring:
  datasource:
    url: jdbc:h2:mem:yorijori;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: false

logging:
  level:
    com.yorijori: DEBUG
