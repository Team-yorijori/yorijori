# 이 파일을 application-secret.yml 로 복사해서 값을 넣는다.
# application-secret.yml 은 .gitignore 에 있어서 깃에 올라가지 않는다. 절대 커밋하지 않는다.
spring:
  datasource:
    username: yorijori
    password: 여기에_DB_비밀번호

yorijori:
  naver:
    enabled: true
    client-id: 여기에_네이버_Client_ID
    client-secret: 여기에_네이버_Client_Secret
  youtube:
    enabled: true
    api-key: 여기에_YouTube_Data_API_키
