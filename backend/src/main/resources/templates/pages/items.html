<!-- 내 식재료 화면 [프론트] -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
  <section data-page="items" th:fragment="page" hidden>
    <div class="card">
      <div class="rec-head" style="margin-bottom:0">
        <div>
          <h1 style="font-size:26px">내 식재료</h1>
          <div class="note">소비기한이 가까운 순서입니다. '자동' 표시는 앱이 보관 기간으로 계산한 참고용 날짜이며, 날짜 칸이나 재료 이름을 눌러 고칠 수 있습니다.</div>
        </div>
        <input class="field item-search" id="itemSearch" type="search" placeholder="재료 찾기 (초성 가능)" aria-label="식재료 검색">
        <button class="btn ghost" id="resetBtn">예시 데이터로 초기화</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>재료</th><th>분류</th><th>수량</th><th>등록일</th><th>소비기한</th><th>상태</th><th></th></tr></thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>
    </div>
  </section>
</body>
</html>
