<!-- My 냉장고 화면 [프론트] -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
  <section data-page="fridge" th:fragment="page" hidden>
    <div class="two">
      <div class="card">
        <h1 class="big">My냉장고</h1>
        <form class="add-row" id="fridgeForm">
          <input class="field" id="fridgeInput" data-ac autocomplete="off" placeholder="재료 이름" aria-label="재료 이름">
          <input class="field date" type="date" id="fridgeDate" aria-label="소비기한 직접 입력(선택)" title="소비기한을 알면 직접 입력">
          <button class="btn" type="submit">추가</button>
        </form>
        <div class="hint" id="fridgeHint"></div>
        <div class="row" style="flex-wrap:wrap;margin:-2px 0 12px">
          <button class="btn ghost" type="button" id="fridgeScan">재료 사진으로 추가</button>
          <button class="btn ghost" type="button" id="fridgeReceipt">영수증·주문내역으로 추가</button>
        </div>
        <div class="label">현재 입력된 재료 · 재료를 누르면 소비기한과 수량을 고칠 수 있습니다</div>
        <div class="shelf" id="shelf"></div>
      </div>
      <div class="card">
        <h2 style="font-size:20px">소비기한 현황</h2>
        <div class="stats" id="stats"></div>
        <ul class="urgent-list" id="urgentList"></ul>
        <div class="row" style="margin-top:16px;justify-content:flex-end;flex-wrap:wrap">
          <button class="btn ghost" data-go="items">식재료 관리</button>
          <button class="btn strong" data-go="recipes">임박 재료로 레시피 보기</button>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
