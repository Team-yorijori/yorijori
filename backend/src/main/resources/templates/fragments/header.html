<!-- 상단바: 로고 · 메뉴 · 스캔 · 애니 On/Off · 로그인 [프론트] -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<header class="bar" th:fragment="header">
  <div class="bar-in">
    <button class="logo" data-go="home" aria-label="요리조리 홈">
      <svg width="46" height="36" viewBox="0 0 46 36" aria-hidden="true"><rect x="0" y="0" width="46" height="36" rx="9" fill="#FFF7F0"/><g fill="#6F4F42"><circle cx="15" cy="15" r="7"/><circle cx="23" cy="11" r="8"/><circle cx="31" cy="15" r="7"/><rect x="13" y="16" width="20" height="11" rx="2"/></g></svg>
      <span class="logo-word">요리<br>조리</span>
    </button>
    <nav class="nav" aria-label="주요 메뉴">
      <button data-go="fridge">My 냉장고</button>
      <button data-go="recipes">AI 매칭 레시피</button>
      <button data-go="items">내 식재료</button>
      <button data-go="dishes">만든 요리</button>
      <button data-go="cart">장보기</button>
    </nav>
    <div class="bar-actions">
      <button class="btn strong" id="scanBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>스캔하기</button>
      <button class="anim-btn" id="animBtn" type="button" aria-pressed="true" title="애니메이션 켜기/끄기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
        <span id="animLabel">애니 ON</span>
      </button>
      <button class="btn" id="loginBtn">로그인</button>
    </div>
  </div>
</header>
</body>
</html>
